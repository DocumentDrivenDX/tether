name: Checks
on: [pull_request]
concurrency:
  group: checks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Routine pull request gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=HEAD
          fi
          make pr-check CHECK_BASE="$BASE_SHA"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Install the pinned npm beside the bundled one
        # Upgrading the bundled npm in place fails on hosted runners
        # (MODULE_NOT_FOUND: promise-retry), so install into its own prefix.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm" --ignore-scripts npm@11.20.0
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - run: test "$(npm --version)" = 11.20.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          python-version: "3.11"
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Put native PostgreSQL tools on PATH
        # The TLS oracle tests run initdb and postgres from PATH.
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - run: make web-check
