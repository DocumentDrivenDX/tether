name: Stage PyPI release candidate

on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write

concurrency:
  group: pypi-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run release qualification
        env:
          BASE_SHA: ${{ github.sha }}
        run: make check CHECK_BASE="$BASE_SHA"
      - run: uv build
      - name: Verify built distributions
        run: uv run --locked python scripts/check_distribution.py dist
      - name: Bind artifacts to tag and source
        run: >-
          uv run --locked python scripts/verify_release_artifacts.py create-manifest
          --dist-dir dist --output dist/release-manifest.json --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" --package novirhiza-tether
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft
          --title "Tether $GITHUB_REF_NAME" --generate-notes dist/*
