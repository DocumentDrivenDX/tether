[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "novirhiza-tether-web-ui"
version = "0.3.0"
description = "Independent ASGI hosting for compiled Tether browser assets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/tether_web_ui"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE-*", "NOTICE"]
