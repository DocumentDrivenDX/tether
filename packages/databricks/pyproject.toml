[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "novirhiza-tether-databricks"
version = "0.3.1"
description = "Optional Databricks Apps carrier for Tether web interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = [
  "novirhiza-tether[postgres]==0.3.1",
  "novirhiza-tether-web-api==0.3.1",
  "novirhiza-tether-web-ui==0.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tether_databricks"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
