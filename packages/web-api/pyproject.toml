[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "novirhiza-tether-web-api"
version = "0.2.0.dev0"
description = "Optional FastAPI adapter for the public Tether client protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = [
  "novirhiza-tether==0.2.0.dev0",
  "fastapi==0.162.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tether_web_api"]

[tool.hatch.build.targets.wheel.force-include]
"schema/http-v1.json" = "tether_web_api/schema/http-v1.json"

[tool.hatch.build.targets.sdist]
include = ["src", "schema", "pyproject.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
