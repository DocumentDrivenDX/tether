[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tether-local-otel-embed-example"
version = "0.2.0.dev0"
description = "Independent Tether embedder with a bounded local OTLP/HTTP diagnostics profile"
readme = "README.md"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "novirhiza-tether==0.2.0.dev0",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "anyio>=4.15,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/tether_otel_example"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
